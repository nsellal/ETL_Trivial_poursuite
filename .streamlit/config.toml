# Configuration Streamlit du dashboard (lu quand Streamlit est lancé depuis la racine)

[theme]
# Charte claire et sobre, alignée sur la palette de src/app.py (graphiques
# Plotly sur fond blanc, texte foncé). Thème imposé : un livrable client garde
# la même identité visuelle quel que soit le réglage du système.
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#1F2937"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#F3F5F8"

[browser]
# Pas d'envoi de statistiques d'usage à Streamlit
gatherUsageStats = false
