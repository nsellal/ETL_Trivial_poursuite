name: trivial_poursuite # nom du projet (snake_case)
version: "1.0.0"
config-version: 2

profile: trivial_pst

# Où dbt cherche les fichiers
model-paths: ["src/models"]
macro-paths: ["src/macros"]

models:
  trivial_poursuite:
    staging:
      +schema: staging
      +materialized: view     # simple requête, rien de stocké
    intermediate:
      +schema: intermediate
      +materialized: table    # lue par tous les marts et Streamlit
    marts:
      +schema: marts
      +materialized: table
