version: 2

sources:
  # silver/obt_answers.parquet est produit par src/bronze_to_silver.py
  # (à lancer avant dbt run) : questions et réponses déjà fusionnées,
  # textes décodés, dates en timestamp Unix, doublons retirés.
  - name: silver
    description: "Couche silver : One Big Table des réponses des IA enrichies de leurs questions."
    tables:
      - name: obt_answers
        description: "1 ligne = 1 réponse (question × modèle × prompt), avec toutes les infos de la question."
        meta:
          external_location: "read_parquet('silver/obt_answers.parquet')"
