version: 2

# Documentation et tests du modèle stg_questions.
# Lancer les tests : dbt test --profiles-dir . --select stg_questions
models:
  - name: stg_questions
    description: "Questions OpenTDB décodées, identifiées et dédoublonnées. 1 ligne = 1 question unique."
    columns:
      - name: question_id
        description: "Clé : 12 premiers caractères du MD5 de question|correct_answer (même calcul que run_benchmark.py)."
        data_tests:
          - unique        # le dédoublonnage a fonctionné
          - not_null      # chaque question a bien une clé

      - name: category
        description: "Catégorie complète, ex. 'Entertainment: Books'."
        data_tests:
          - not_null

      - name: category_group
        description: "Partie avant ':' de la catégorie, ex. 'Entertainment'."
        data_tests:
          - not_null

      - name: type
        description: "multiple = QCM à 4 choix, boolean = vrai/faux."
        data_tests:
          - accepted_values:
              arguments:
                values: ["multiple", "boolean"]

      - name: difficulty
        description: "Niveau de difficulté donné par OpenTDB."
        data_tests:
          - accepted_values:
              arguments:
                values: ["easy", "medium", "hard"]

      - name: question
        description: "Texte de la question, décodé."
        data_tests:
          - not_null

      - name: correct_answer
        description: "Bonne réponse, décodée."
        data_tests:
          - not_null

      - name: scraped_at
        description: "Date d'extraction, timestamp Unix en secondes (UTC)."
        data_tests:
          - not_null

      - name: scraped_at_repr
        description: "Date d'extraction au format français, heure de Paris : 'JJ/MM/AAAA HH:MM:SS'."
        data_tests:
          - not_null

      - name: nb_choices
        description: "Nombre de choix proposés (bonne réponse + mauvaises)."
        data_tests:
          - accepted_values:
              arguments:
                values: [2, 4]
                quote: false   # nombres, pas du texte
